name: RELEASE

on:
  create:

permissions:
  contents: read

jobs:
  build-apk-and-sign:
    # Release Note作成のために必要
    permissions:
      contents: write
      id-token: write
      attestations: write

    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'v')

    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Clone repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      # Firebaseを利用する場合はSecretから情報を取得
      # textだと改行等でエラーになるためbase64で1行にして取得
      - name: Write google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Build APK
        run: |
          flutter clean
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=./build/symbols

      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign APK files
        run: |
          cosign sign-blob --yes build/app/outputs/flutter-apk/app-arm64-v8a-release.apk --output-signature build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sig
          cosign sign-blob --yes build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk --output-signature build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk.sig

      - name: Generate hashes for SLSA provenance
        id: hash
        run: |
          echo "hashes=$(sha256sum build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk.sig
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk.sig

  provenance:
    needs: [build-apk-and-sign]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build-apk-and-sign.outputs.hashes }}"
      # Release Noteを自動背作成しmultiple.intoto.jsonlを添付
      # この時点ではDraftでなく後続のStepでDraftに戻す
      # falseにして手動制御したほうがよい
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}

  create-draft-release:
    needs: [build-apk-and-sign, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-apks
          path: apks/

      - name: Create Draft Release with APKs
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            apks/app-arm64-v8a-release.apk
            apks/app-armeabi-v7a-release.apk
            apks/app-arm64-v8a-release.apk.sig
            apks/app-armeabi-v7a-release.apk.sig

      # Docker Repositoryへアップロード
      # Open SSF Scoreのため
      - name: Create Dockerfile
        run: |
          cat << EOF > Dockerfile
          FROM alpine:latest
          COPY apks/ /app/
          WORKDIR /app
          EOF

      - name: Login to GitHub Container Registry(ghcr.io)
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
