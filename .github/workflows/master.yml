# 参考:
# https://github.com/zgosalvez/github-actions-flutter-workflows
# https://github.com/marketplace?query=flutter&type=actions

# usesのバージョンはハッシュ化する
# https://app.stepsecurity.io/secureworkflow
# https://app.stepsecurity.io/scorecard/securerepo/Flupinochan/popcal/master.yml/master?repo=Flupinochan/popcal&enable=pin

name: MASTER

on:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

# 連続してpushした場合に実行中のworkflowをキャンセル
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # codeに関係しないファイル変更時はbuild実行しない
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Clone repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Need to run workflow
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            src:
              - '/**/*.dart'

  # Require status checks to passのステータスチェック名となる
  build:
    permissions:
      contents: read
    # UbuntuだとGolden Testが失敗するためローカル環境のWindowsに合わせる
    # runs-on: ubuntu-latest
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.src == 'true'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Clone repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs --build-filter="lib/**"

      # Format発生時にExit 1でエラーが発生
      # flutter formatコマンドは存在しなくdart formatのため注意
      - name: Check format
        run: dart format -o show --set-exit-if-changed .

      # infoはエラー扱いにしない
      - name: Check analyze
        run: flutter analyze --no-fatal-infos --no-pub

      - name: Run Tests
        run: flutter test --no-pub --coverage

      # 動作していないかも
      - name: Filter coverage (remove generated files)
        shell: bash
        run: |
          # Windowsでも動作するようにbashシェルを指定
          if command -v lcov &> /dev/null; then
            lcov --remove coverage/lcov.info \
              "**/*.g.dart" \
              "**/*.freezed.dart" \
              -o coverage/lcov_filtered.info
          else
            # lcovがない場合は元のファイルをコピー
            cp coverage/lcov.info coverage/lcov_filtered.info
          fi

      - name: Check coverage
        uses: VeryGoodOpenSource/very_good_coverage@3b475421464c564c0714d92ce02742bd81fa9eda # v2.2.0
        with:
          path: './coverage/lcov_filtered.info'
          min_coverage: 0
          # テストが少ないため0%でもOK
          exclude: '**/*.g.dart **/*.freezed.dart'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fdcc8476540edceab3de004e990f80d881c6cc00 # v5.5.0
        with:
          files: ./coverage/lcov_filtered.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          exclude: '**/*.g.dart,**/*.freezed.dart'

  # ブランチ保護ルール用の最終チェック
  # workflow自体は実行し結果を成功/失敗にする必要がある
  status-check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: always()
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - name: Check status
        run: |
          if [ "${{ needs.changes.outputs.src }}" == "false" ] || [ "${{ needs.build.result }}" == "skipped" ]; then
            echo "✅ Passed - No build needed"
            exit 0
          fi

          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ Passed - Build successful"
            exit 0
          else
            echo "❌ Failed - Build failed or cancelled"
            exit 1
          fi
